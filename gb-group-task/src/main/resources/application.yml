# 应用名称(任务服务)
server:
  port: 9014
spring:
  application:
    name: spring-gbshop-task
  profiles:
    # 启动时通过 --spring.profiles.active=dev|test|prod 或 SPRING_PROFILES_ACTIVE 环境变量切换环境，默认 dev
    active: ${spring.profiles.active:dev}
  autoconfigure:
    # 仅使用 RedisTemplate，不用 Spring Data Redis Repository，关闭其自动扫描(消除 Multiple Spring Data modules 提示)
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  http:
    encoding:
      force-response: true
      charset: UTF-8
      enabled: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.gbshop.group: INFO
    # 表为复合主键、实体无 @TableId，MyBatis-Plus 启动提示非错误，调低级别消除
    com.baomidou.mybatisplus.core.injector.DefaultSqlInjector: error

# mybatis输出sql日志
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
