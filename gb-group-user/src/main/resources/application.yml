# 应用名称(团购服务)
server:
  port: 9011
spring:
  application:
    name: spring-gbshop-user
  profiles:
    # 环境配置文件命名规则：active 值必须与文件名后缀一致
    #   dev  -> application-dev.yml   （开发）
    #   test -> application-test.yml  （测试，默认）
    #   prod -> application-prod.yml  （生产）
    # 切换：--spring.profiles.active=dev|test|prod 或环境变量 SPRING_PROFILES_ACTIVE
    active: ${spring.profiles.active:dev}
  http:
    encoding:
      force-response: true
      charset: UTF-8
      enabled: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.gbshop.group: INFO

# mybatis输出sql日志
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
